<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <!-- Base Background Badge -->
  <rect width="64" height="64" rx="14" fill="url(#wz-grad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Subtle Open Book Base Lines -->
  <path d="M12 47 C20 44, 28 44, 32 46 C36 44, 44 44, 52 47" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  <path d="M12 50 C20 47, 28 47, 32 49 C36 47, 44 47, 52 50" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />
  
  <!-- Stylized Letter 'W' -->
  <path d="M14 19 L20.5 41 L27 24 L32 35 L37 24 L43.5 41 L50 19" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Encyclopedic Orbit / Zero (0) Sphere Ring Accent in Top Right -->
  <circle cx="49" cy="15" r="5.5" fill="#0f172a" stroke="url(#gold-accent)" stroke-width="2" />
  <circle cx="49" cy="15" r="2" fill="#38bdf8" />
</svg>
